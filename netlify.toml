[build]
  command = "npm run build"
  publish = "dist"

# Google AdSense 광고 스크립트와 충돌하지 않도록 미디어 변환기 전용으로 스코프 지정
[[headers]]
  for = "/media*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"

# Netlify HUD / Badge 차단 리디렉션
[[redirects]]
  from = "/.netlify/scripts/hud*"
  to = "/empty.js"
  status = 200
  force = true

# SPA 라우팅 (새로고침 시 404 방지)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
