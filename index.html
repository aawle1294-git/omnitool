    <!-- Netlify Badge Blockers (Head level) -->
    <style id="nl-badge-blocker">
      /* Netlify HUD / badge — all known selectors */
      #nl-badge-frame,
      #nl-hud-frame,
      #netlify-badge-frame,
      iframe[id*="nl-"],
      iframe[id*="netlify"],
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"],
      iframe[src*="app.netlify.com"],
      iframe[src*="/.netlify/"],
      div[id*="netlify-badge"],
      div[id*="netlify-hud"],
      [data-testid*="netlify-badge"],
      a[href*="app.netlify.com"] > img[alt*="Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        clip-path: inset(100%) !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        overflow: hidden !important;
      }
    </style>
    <script>
      (function() {
        // Hide via localStorage (Netlify HUD respects these keys)
        try {
          var farFuture = Date.now() + 31536000000;
          localStorage.setItem('nl-hud:public:v1', 'hidden:' + farFuture);
          localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
          localStorage.setItem('nl-hud-hidden', '1');
          localStorage.setItem('netlify-badge-dismissed', '1');
        } catch(e) {}

        function removeNetlifyNodes(root) {
          var selectors = [
            '#nl-badge-frame', '#nl-hud-frame', '#netlify-badge-frame',
            'iframe[src*="app.netlify.com"]', 'iframe[src*="/.netlify/"]', 'iframe[title*="Netlify"]',
            'div[id*="netlify-badge"]', 'div[id*="netlify-hud"]'
          ];
          selectors.forEach(function(sel) {
            try {
              (root || document).querySelectorAll(sel).forEach(function(el) { el.remove(); });
            } catch(e) {}
          });
        }

        removeNetlifyNodes(document);

        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (!node || node.nodeType !== 1) return;
              var el = node;
              var id = el.id || '';
              var src = el.src || '';
              var title = el.title || '';
              // Block only Netlify HUD/badge scripts, never site bundle scripts
              if (el.tagName === 'SCRIPT' && src && (src.indexOf('/.netlify/scripts/hud') !== -1 || src.indexOf('netlify-badge') !== -1)) {
                el.remove(); return;
              }
              // Block badge/hud iframes and divs
              if (el.tagName !== 'SCRIPT' && (
                  id.indexOf('nl-') === 0 ||
                  id.indexOf('netlify-badge') !== -1 ||
                  id.indexOf('netlify-hud') !== -1 ||
                  (el.tagName === 'IFRAME' && (src.indexOf('app.netlify.com') !== -1 || src.indexOf('/.netlify/') !== -1 || title.indexOf('Netlify') !== -1))
              )) {
                el.remove(); return;
              }
              // Also check children
              removeNetlifyNodes(el);
            });
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
