    <!-- Netlify Badge Auto-Suppressor -->
    <script>
      (function() {
        function hideNetlifyBadge() {
          const selectors = [
            '#netlify-badge',
            '.netlify-badge',
            'iframe[src*="netlify"]',
            'iframe[id*="netlify"]',
            'div[id*="netlify-badge"]',
            'div[class*="netlify-badge"]',
            '[data-netlify-badge]',
            'a[href*="netlify.com"][class*="badge"]'
          ];
          document.querySelectorAll(selectors.join(',')).forEach(function(el) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('opacity', '0', 'important');
          });
        }
        window.addEventListener('DOMContentLoaded', hideNetlifyBadge);
        window.addEventListener('load', hideNetlifyBadge);
        try {
          const obs = new MutationObserver(hideNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        } catch(e) {}
      })();
    </script>
  </body>
