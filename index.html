    <!-- Netlify Badge Blockers (Head level) -->
    <style id="nl-badge-blocker">
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[id*="nl-"],
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"],
      div[id*="netlify-badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        clip-path: inset(100%) !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
      }
    </style>
    <script>
      (function() {
        try {
          localStorage.setItem('nl-hud:public:v1', 'hidden:' + (Date.now() + 604800000));
          localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
        } catch(e) {}
        
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              var node = added[j];
              if (!node || node.nodeType !== 1) continue;
              if (node.tagName === 'SCRIPT' && node.src && node.src.indexOf('hud') !== -1) {
                node.remove();
              }
              if (node.id === 'nl-badge-frame' || node.id === 'nl-hud-frame' || (node.tagName === 'IFRAME' && node.title && node.title.indexOf('Netlify') !== -1)) {
                node.remove();
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
